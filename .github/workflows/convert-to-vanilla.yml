name: Convert GApps to Vanilla

on:
  workflow_dispatch:
    inputs:
      gapps_url:
        description: 'URL of the GApps firmware (zip, img.xz, or raw img)'
        required: false
        default: 'https://mirror.tejas101k.workers.dev/0:/Project_Infinity-X-4.1-X6833B-18.10.2026-GAPPS-OFFICIAL.zip'
      vanilla_url:
        description: 'URL of the Vanilla firmware (zip, img.xz, or raw img)'
        required: false
        default: 'https://mirror.tejas101k.workers.dev/0:/Project_Infinity-X-4.1-dubai-18.10.2026-VANILLA-OFFICIAL.zip'
      release_tag:
        description: 'Release tag (use "auto" for automatic timestamp-based tag)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  convert:
    name: Convert GApps to Vanilla
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            erofs-utils \
            e2fsprogs \
            android-sdk-libsparse-utils \
            zip \
            unzip \
            xz-utils \
            attr \
            acl \
            p7zip-full \
            curl \
            wget \
            jq \
            file

      - name: Create working directories
        run: |
          mkdir -p gapps vanilla work
          echo "Working directories created."

      - name: Download GApps firmware
        run: |
          echo "Downloading GApps firmware from: ${{ github.event.inputs.gapps_url }}"
          curl -L --retry 5 --retry-delay 5 --retry-connrefused \
            -o gapps/image \
            "${{ github.event.inputs.gapps_url }}"
          ls -lh gapps/image
          file gapps/image

      - name: Download Vanilla firmware
        run: |
          echo "Downloading Vanilla firmware from: ${{ github.event.inputs.vanilla_url }}"
          curl -L --retry 5 --retry-delay 5 --retry-connrefused \
            -o vanilla/image \
            "${{ github.event.inputs.vanilla_url }}"
          ls -lh vanilla/image
          file vanilla/image

      - name: Extract GApps archive
        run: |
          set -e
          cd gapps
          mkdir -p extracted
          if file image | grep -q "Zip archive"; then
            echo "GApps: Zip archive detected"
            unzip -o image -d extracted
          elif file image | grep -q "XZ compressed"; then
            echo "GApps: XZ compressed detected"
            xz -dk image
            if [ -f image ]; then
              mv image extracted/system.img
            fi
          elif file image | grep -q "Android sparse"; then
            echo "GApps: Android sparse image detected"
            mv image extracted/system.img
          elif file image | grep -q "EROFS"; then
            echo "GApps: EROFS image detected"
            mv image extracted/system.img
          elif file image | grep -q "ext[234] filesystem"; then
            echo "GApps: ext4 image detected"
            mv image extracted/system.img
          else
            echo "GApps: Raw image (unknown format), treating as system.img"
            mv image extracted/system.img
          fi
          ls -lh extracted/

      - name: Extract Vanilla archive
        run: |
          set -e
          cd vanilla
          mkdir -p extracted
          if file image | grep -q "Zip archive"; then
            echo "Vanilla: Zip archive detected"
            unzip -o image -d extracted
          elif file image | grep -q "XZ compressed"; then
            echo "Vanilla: XZ compressed detected"
            xz -dk image
            if [ -f image ]; then
              mv image extracted/system.img
            fi
          elif file image | grep -q "Android sparse"; then
            echo "Vanilla: Android sparse image detected"
            mv image extracted/system.img
          elif file image | grep -q "EROFS"; then
            echo "Vanilla: EROFS image detected"
            mv image extracted/system.img
          elif file image | grep -q "ext[234] filesystem"; then
            echo "Vanilla: ext4 image detected"
            mv image extracted/system.img
          else
            echo "Vanilla: Raw image (unknown format), treating as system.img"
            mv image extracted/system.img
          fi
          ls -lh extracted/

      - name: Auto-detect image formats and extract partitions
        run: |
          set -e
          cd work

          extract_image() {
            local img="$1"
            local out="$2"
            mkdir -p "$out"
            local ftype=$(file -b "$img")
            echo "  Image: $img"
            echo "  Type:  $ftype"

            if echo "$ftype" | grep -q "EROFS"; then
              echo "  Action: EROFS extract via fsck.erofs"
              fsck.erofs --extract="$out" "$img"
            elif echo "$ftype" | grep -qE "ext[234] filesystem"; then
              echo "  Action: ext4 mount via loop"
              sudo mount -o loop,ro "$img" "$out"
            elif echo "$ftype" | grep -q "Android sparse"; then
              echo "  Action: Android sparse via simg2img"
              simg2img "$img" "${img}.raw"
              extract_image "${img}.raw" "$out"
            else
              echo "  Action: Unknown format, attempting fsck.erofs"
              fsck.erofs --extract="$out" "$img" || true
            fi
          }

          echo "=== Extracting GApps partitions ==="
          for part in system system_ext product; do
            img=$(find ../gapps/extracted -name "${part}.img" 2>/dev/null | head -1)
            if [ -n "$img" ]; then
              echo "GApps ${part}: $img"
              extract_image "$img" "gapps_${part}_raw"
            else
              echo "WARNING: GApps ${part}.img not found"
            fi
          done

          echo "=== Extracting Vanilla partitions ==="
          for part in system system_ext product; do
            img=$(find ../vanilla/extracted -name "${part}.img" 2>/dev/null | head -1)
            if [ -n "$img" ]; then
              echo "Vanilla ${part}: $img"
              extract_image "$img" "vanilla_${part}_raw"
            else
              echo "WARNING: Vanilla ${part}.img not found"
            fi
          done

          echo "=== Extraction complete ==="
          ls -la

      - name: Remove GApps components from product partition
        run: |
          set -e
          cd work

          echo "Removing GApps from product_raw"

          rm -rf gapps_product_raw/priv-app/AndroidAutoStubPrebuilt \
                 gapps_product_raw/priv-app/ConfigUpdater \
                 gapps_product_raw/priv-app/DeviceIntelligenceNetworkPrebuiltAstrea \
                 gapps_product_raw/priv-app/DevicePersonalizationAiAiPrebuiltPixel2025 \
                 gapps_product_raw/priv-app/GoogleRestorePrebuilt-v1007163 \
                 gapps_product_raw/priv-app/PartnerSetupPrebuilt \
                 gapps_product_raw/priv-app/Phonesky \
                 gapps_product_raw/priv-app/PrebuiltDeskClockGoogle_76042511 \
                 gapps_product_raw/priv-app/PrebuiltGmsCore \
                 gapps_product_raw/priv-app/SearchSelectorPrebuilt \
                 gapps_product_raw/priv-app/SettingsIntelligence \
                 gapps_product_raw/priv-app/SettingsIntelligenceGooglePrebuilt \
                 gapps_product_raw/priv-app/SetupWizardPrebuilt_versioned \
                 gapps_product_raw/priv-app/TurboPrebuilt \
                 gapps_product_raw/priv-app/Velvet \
                 gapps_product_raw/priv-app/WallpaperEffect \
                 gapps_product_raw/priv-app/WellbeingPrebuilt 2>/dev/null || true

          rm -rf gapps_product_raw/app/CalculatorGooglePrebuilt_85006267 \
                 gapps_product_raw/app/Chrome \
                 gapps_product_raw/app/Chrome-Stub \
                 gapps_product_raw/app/DevicePolicyPrebuilt-v10572820 \
                 gapps_product_raw/app/GoogleContacts \
                 gapps_product_raw/app/GoogleTTS \
                 gapps_product_raw/app/LatinIMEGooglePrebuilt \
                 gapps_product_raw/app/LocationHistoryPrebuilt \
                 gapps_product_raw/app/MarkupGoogle_v2 \
                 gapps_product_raw/app/ModuleMetadataGoogle \
                 gapps_product_raw/app/PixelThemesStub2025 \
                 gapps_product_raw/app/SoundPickerPrebuilt_33000242 \
                 gapps_product_raw/app/SwitchAccessPrebuilt_1.17.0.877181440 \
                 gapps_product_raw/app/talkback \
                 gapps_product_raw/app/TrichromeLibrary \
                 gapps_product_raw/app/TrichromeLibrary-Stub \
                 gapps_product_raw/app/WallpaperAIPrebuilt_10000372 \
                 gapps_product_raw/app/WallpaperEmojiPrebuilt-foldable-wallpaper \
                 gapps_product_raw/app/WebViewGoogle \
                 gapps_product_raw/app/WebViewGoogle-Stub 2>/dev/null || true

          rm -rf gapps_product_raw/usr/share/ime/google \
                 gapps_product_raw/usr/srec/en-US 2>/dev/null || true

          rm -f gapps_product_raw/overlay/*_GMS.apk \
                gapps_product_raw/overlay/GoogleSettingsOverlay.apk \
                gapps_product_raw/overlay/FrameworkOverlayThemePicker.apk \
                gapps_product_raw/overlay/SettingsOverlayThemePicker.apk \
                gapps_product_raw/overlay/SystemUIOverlayThemePicker.apk \
                gapps_product_raw/overlay/FrameworkPixelSounds.apk \
                gapps_product_raw/overlay/SettingsPixelSounds.apk 2>/dev/null || true
          rm -rf gapps_product_raw/overlay/PixelWallpaperOverlay 2>/dev/null || true

          rm -f gapps_product_raw/etc/default-permissions/default-permissions-com.google.android.apps.pixel.agent.xml \
                gapps_product_raw/etc/default-permissions/default-permissions-safetyhub.xml 2>/dev/null || true
          rm -f gapps_product_raw/etc/permissions/com.google.android.apps.setupwizard.searchselector.xml \
                gapps_product_raw/etc/permissions/privapp-permissions-google-p.xml \
                gapps_product_raw/etc/permissions/velvet_app-privapp-permissions.xml 2>/dev/null || true
          rm -f gapps_product_raw/etc/sysconfig/allowed_apex_com.google.android.gmssystem.xml \
                gapps_product_raw/etc/sysconfig/contextual_search.xml \
                gapps_product_raw/etc/sysconfig/game_service.xml \
                gapps_product_raw/etc/sysconfig/google_build.xml \
                gapps_product_raw/etc/sysconfig/google-hiddenapi-package-whitelist.xml \
                gapps_product_raw/etc/sysconfig/google-preinstalled-packages-product-themepicker.xml \
                gapps_product_raw/etc/sysconfig/google-staged-installer-whitelist.xml \
                gapps_product_raw/etc/sysconfig/google.xml \
                gapps_product_raw/etc/sysconfig/nexus.xml \
                gapps_product_raw/etc/sysconfig/nga.xml \
                gapps_product_raw/etc/sysconfig/pixel_experience_*.xml \
                gapps_product_raw/etc/sysconfig/preinstalled-packages-product-pixel-*.xml \
                gapps_product_raw/etc/sysconfig/sysconfig-themepicker.xml 2>/dev/null || true
          rm -f gapps_product_raw/etc/preferred-apps/google.xml 2>/dev/null || true
          rm -f gapps_product_raw/etc/security/fsverity/gms_fsverity_cert.der \
                gapps_product_raw/etc/security/fsverity/play_store_fsi_cert.der 2>/dev/null || true
          rm -f gapps_product_raw/apex/com.google.android.gmssystem.prodvic.apex 2>/dev/null || true

          echo "GApps removed from product_raw"

      - name: Remove GApps components from system_ext partition
        run: |
          set -e
          cd work

          echo "Removing GApps from system_ext_raw"

          rm -rf gapps_system_ext_raw/priv-app/GoogleServicesFramework \
                 gapps_system_ext_raw/priv-app/WallpaperPickerGoogleRelease \
                 gapps_system_ext_raw/priv-app/SetupWizardPixelPrebuilt_versioned \
                 gapps_system_ext_raw/priv-app/MagicPortraitWallpapers \
                 gapps_system_ext_raw/priv-app/DeviceIntelligenceNetworkPrebuiltAstrea \
                 gapps_system_ext_raw/app/Flipendo 2>/dev/null || true
          rm -f gapps_system_ext_raw/overlay/*GlanceableHub* 2>/dev/null || true
          rm -f gapps_system_ext_raw/etc/permissions/privapp-permissions-google-se.xml 2>/dev/null || true
          rm -f gapps_system_ext_raw/etc/sysconfig/google-privapp-permissions-themepicker-se.xml 2>/dev/null || true

          echo "GApps removed from system_ext_raw"

      - name: Remove GApps components from system partition
        run: |
          set -e
          cd work

          echo "Removing GApps from system_raw"

          rm -rf gapps_system_raw/system/priv-app/TagGoogle \
                 gapps_system_raw/system/app/GoogleExtShared \
                 gapps_system_raw/system/app/GooglePrintRecommendationService 2>/dev/null || true
          rm -f gapps_system_raw/system/etc/permissions/privapp-permissions-google.xml 2>/dev/null || true
          rm -f gapps_system_raw/system/etc/sysconfig/com.google.android.mainline.patchlevel.2.xml 2>/dev/null || true
          rm -f gapps_system_raw/system/apex/com.google.android.extservices.apex 2>/dev/null || true

          echo "GApps removed from system_raw"

      - name: Add AOSP components from Vanilla
        run: |
          set -e
          cd work

          echo "Adding AOSP components from Vanilla"

          # --- system partition ---
          mkdir -p gapps_system_raw/system/app/ExtShared
          cp -a vanilla_system_raw/system/app/ExtShared/. gapps_system_raw/system/app/ExtShared/ 2>/dev/null || true
          if [ -f gapps_system_raw/system/app/ExtShared/ExtShared.apk ]; then
            setfattr -n security.selinux -v "u:object_r:system_file:s0" gapps_system_raw/system/app/ExtShared/ExtShared.apk || true
          fi

          cat > gapps_system_raw/system/etc/permissions/android.ext.shared.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <library name="android.ext.shared" file="/system/app/ExtShared/ExtShared.apk"/>
          </permissions>
          EOF
          setfattr -n security.selinux -v "u:object_r:system_file:s0" gapps_system_raw/system/etc/permissions/android.ext.shared.xml || true

          for d in LiveWallpapersPicker ContactsPicker; do
            mkdir -p gapps_system_raw/system/priv-app/$d
            cp -a vanilla_system_raw/system/priv-app/$d/. gapps_system_raw/system/priv-app/$d/ 2>/dev/null || true
          done

          mkdir -p gapps_system_raw/system/app/WallpaperBackup
          cp -a vanilla_system_raw/system/app/WallpaperBackup/. gapps_system_raw/system/app/WallpaperBackup/ 2>/dev/null || true

          cp -a vanilla_system_raw/system/etc/permissions/android.software.live_wallpaper.xml \
                gapps_system_raw/system/etc/permissions/ 2>/dev/null || true

          # --- system_ext partition ---
          for d in Provision ThemePicker; do
            mkdir -p gapps_system_ext_raw/priv-app/$d
            cp -a vanilla_system_ext_raw/priv-app/$d/. gapps_system_ext_raw/priv-app/$d/ 2>/dev/null || true
          done

          # --- product partition ---
          mkdir -p gapps_product_raw/app/ModuleMetadata
          cp -a vanilla_product_raw/app/ModuleMetadata/. gapps_product_raw/app/ModuleMetadata/ 2>/dev/null || true

          for d in DeskClock ExactCalculator LatinIME webview; do
            mkdir -p gapps_product_raw/app/$d
            cp -a vanilla_product_raw/app/$d/. gapps_product_raw/app/$d/ 2>/dev/null || true
          done

          mkdir -p gapps_product_raw/lib64
          cp -a vanilla_product_raw/lib64/libjni_latinime.so gapps_product_raw/lib64/ 2>/dev/null || true

          mkdir -p gapps_product_raw/overlay
          cp -a vanilla_product_raw/overlay/LatinIME__*_auto_generated_rro_product.apk \
                gapps_product_raw/overlay/LatinIME__infinity_X6833B__auto_generated_rro_product.apk 2>/dev/null || true

          mkdir -p gapps_product_raw/priv-app/Contacts
          cp -a vanilla_product_raw/priv-app/Contacts/. gapps_product_raw/priv-app/Contacts/ 2>/dev/null || true
          cp -a vanilla_product_raw/etc/permissions/com.android.contacts.xml \
                gapps_product_raw/etc/permissions/ 2>/dev/null || true

          # --- SELinux labels for copied APKs ---
          for f in \
            gapps_product_raw/app/DeskClock/DeskClock.apk \
            gapps_product_raw/app/ExactCalculator/ExactCalculator.apk \
            gapps_product_raw/app/LatinIME/LatinIME.apk \
            gapps_product_raw/app/webview/webview.apk \
            gapps_product_raw/priv-app/Contacts/Contacts.apk \
            gapps_system_raw/system/priv-app/LiveWallpapersPicker/LiveWallpapersPicker.apk \
            gapps_system_raw/system/app/WallpaperBackup/WallpaperBackup.apk \
            gapps_system_raw/system/priv-app/ContactsPicker/ContactsPicker.apk \
            gapps_system_ext_raw/priv-app/Provision/Provision.apk \
            gapps_system_ext_raw/priv-app/ThemePicker/ThemePicker.apk; do
            if [ -f "$f" ]; then
              setfattr -n security.selinux -v "u:object_r:system_file:s0" "$f" || true
            fi
          done

          # --- android.ext.services APEX (AOSP) ---
          if [ ! -f gapps_system_raw/system/apex/com.android.extservices.apex ]; then
            if [ -f vanilla_system_raw/system/apex/com.android.extservices.capex ]; then
              mkdir -p /tmp/capex_extract
              unzip -o vanilla_system_raw/system/apex/com.android.extservices.capex -d /tmp/capex_extract 2>/dev/null || true
              cp -a /tmp/capex_extract/original_apex gapps_system_raw/system/apex/com.android.extservices.apex 2>/dev/null || true
            elif [ -f vanilla_system_raw/system/apex/com.android.extservices.apex ]; then
              cp -a vanilla_system_raw/system/apex/com.android.extservices.apex gapps_system_raw/system/apex/ 2>/dev/null || true
            fi
          fi
          if [ -f gapps_system_raw/system/apex/com.android.extservices.apex ]; then
            setfattr -n security.selinux -v "u:object_r:system_file:s0" gapps_system_raw/system/apex/com.android.extservices.apex || true
          fi

          echo "AOSP components added"

      - name: Detect original UUIDs and filesystem parameters
        run: |
          set -e
          cd work

          for part in system system_ext product; do
            img="../gapps/extracted/${part}.img"
            if [ -f "$img" ]; then
              ftype=$(file -b "$img")
              echo "GApps ${part}: $ftype"

              if echo "$ftype" | grep -q "EROFS"; then
                UUID=$(dump.erofs -s "$img" 2>/dev/null | grep -oP 'UUID:\s*\K[0-9a-f-]+' | head -1 || true)
                if [ -z "$UUID" ]; then
                  UUID=$(file -b "$img" | grep -oP 'uuid=\K[0-9a-f-]+' | head -1 || true)
                fi
                echo "  UUID: ${UUID:-unknown}"
                echo "$UUID" > "${part}_uuid.txt"
                echo "erofs" > "${part}_format.txt"
              elif echo "$ftype" | grep -qE "ext[234] filesystem"; then
                UUID=$(blkid -o value -s UUID "$img" 2>/dev/null || true)
                if [ -z "$UUID" ]; then
                  UUID=$(dumpe2fs -h "$img" 2>/dev/null | grep -i "UUID" | awk '{print $3}' || true)
                fi
                echo "  UUID: ${UUID:-unknown}"
                echo "$UUID" > "${part}_uuid.txt"
                echo "ext4" > "${part}_format.txt"
              elif echo "$ftype" | grep -q "Android sparse"; then
                simg2img "$img" "${img}.raw"
                ftype2=$(file -b "${img}.raw")
                if echo "$ftype2" | grep -q "EROFS"; then
                  UUID=$(dump.erofs -s "${img}.raw" 2>/dev/null | grep -oP 'UUID:\s*\K[0-9a-f-]+' | head -1 || true)
                  echo "$UUID" > "${part}_uuid.txt"
                  echo "erofs" > "${part}_format.txt"
                elif echo "$ftype2" | grep -qE "ext[234] filesystem"; then
                  UUID=$(blkid -o value -s UUID "${img}.raw" 2>/dev/null || true)
                  echo "$UUID" > "${part}_uuid.txt"
                  echo "ext4" > "${part}_format.txt"
                fi
              else
                echo "  Unknown format"
                echo "" > "${part}_uuid.txt"
                echo "erofs" > "${part}_format.txt"
              fi
            else
              echo "WARNING: GApps ${part}.img not found"
              echo "" > "${part}_uuid.txt"
              echo "erofs" > "${part}_format.txt"
            fi
          done

          echo "=== Detected UUIDs and formats ==="
          for part in system system_ext product; do
            echo "${part}: format=$(cat ${part}_format.txt) uuid=$(cat ${part}_uuid.txt)"
          done

      - name: Detect EROFS parameters from original images
        run: |
          set -e
          cd work

          detect_erofs_params() {
            local img="$1"
            local opts=""

            local ftype=$(file -b "$img" 2>/dev/null)
            local comp=""
            if echo "$ftype" | grep -qi "LZ4"; then
              comp="lz4"
            elif echo "$ftype" | grep -qi "LZMA"; then
              comp="lzma"
            elif echo "$ftype" | grep -qi "DEFLATE"; then
              comp="deflate"
            elif echo "$ftype" | grep -qi "ZSTD"; then
              comp="zstd"
            fi

            local dump=""
            if command -v dump.erofs >/dev/null 2>&1; then
              dump=$(dump.erofs -s "$img" 2>/dev/null || dump.erofs --superblock "$img" 2>/dev/null || true)
            fi

            local blocksize=4096
            local pcluster=65536
            local comp_level=""
            local extra=""

            if [ -n "$dump" ]; then
              local blk_log2=$(echo "$dump" | grep -oP 'blkszbits[^\d]*\K\d+' | head -1)
              if [ -z "$blk_log2" ]; then
                blk_log2=$(echo "$dump" | grep -oP 'blocksize[^\d]*\K\d+' | head -1)
              fi
              if [ -n "$blk_log2" ]; then
                if [ "$blk_log2" -le 16 ] 2>/dev/null; then
                  blocksize=$((1 << blk_log2))
                else
                  blocksize=$blk_log2
                fi
              fi

              local pc=$(echo "$dump" | grep -oP 'pclusterblks[^\d]*\K\d+' | head -1)
              if [ -n "$pc" ]; then
                pcluster=$((pc * blocksize))
              else
                pc=$(echo "$dump" | grep -oP 'physical.cluster[^\d]*\K\d+' | head -1)
                if [ -n "$pc" ]; then
                  pcluster=$pc
                fi
              fi

              local lvl=$(echo "$dump" | grep -oP 'compress[._ ]?level[^\d]*\K\d+' | head -1)
              if [ -n "$lvl" ]; then
                comp_level=",level=$lvl"
              fi

              if echo "$dump" | grep -qi "FRAGMENTS"; then
                extra="$extra -Efragments"
              fi
              if echo "$dump" | grep -qi "DEDUPE"; then
                extra="$extra -Ededupe"
              fi
              if echo "$dump" | grep -qi "BIG_PCLUSTER"; then
                extra="$extra -C$pcluster"
              fi
              if echo "$dump" | grep -qi "ZERO_PADDING\|LZ4_0PADDING"; then
                extra="$extra -E0padding"
              fi
            fi

            if [ -z "$blocksize" ]; then
              blocksize=4096
            fi
            if [ -z "$pcluster" ]; then
              pcluster=65536
            fi
            if [ -z "$comp" ]; then
              comp="lz4hc"
            fi

            opts="-z$comp$comp_level -b$blocksize"
            if [ "$pcluster" != "4096" ]; then
              opts="$opts -C$pcluster"
            fi
            opts="$opts $extra"
            opts=$(echo "$opts" | xargs)
            echo "$opts"
          }

          for part in system system_ext product; do
            img="../gapps/extracted/${part}.img"
            if [ -f "$img" ]; then
              opts=$(detect_erofs_params "$img")
              echo "EROFS params for ${part}: $opts"
              echo "$opts" > "${part}_erofs_params.txt"
            else
              echo "-zlz4hc -b4096 -C65536" > "${part}_erofs_params.txt"
            fi
          done

      - name: Rebuild images preserving format, UUID and SELinux
        run: |
          set -e
          cd work

          build_erofs() {
            local raw="$1"
            local out="$2"
            local uuid="$3"
            local params_file="$4"
            local opts=$(cat "$params_file" 2>/dev/null || echo "-zlz4hc -b4096 -C65536")
            echo "  EROFS params: $opts"
            if [ -n "$uuid" ]; then
              mkfs.erofs $opts -U "$uuid" "$out" "$raw"
            else
              mkfs.erofs $opts "$out" "$raw"
            fi
          }

          build_ext4() {
            local raw="$1"
            local out="$2"
            local uuid="$3"
            local orig_img="$4"

            local size=$(du -sb "$raw" | awk '{print $1}')
            size=$((size + size / 10 + 16*1024*1024))
            truncate -s "$size" "$out"

            if [ -n "$uuid" ]; then
              mkfs.ext4 -F -U "$uuid" -d "$raw" "$out"
            else
              mkfs.ext4 -F -d "$raw" "$out"
            fi

            if [ -f "$orig_img" ] && file -b "$orig_img" | grep -qi "Android sparse"; then
              img2simg "$out" "${out}.sparse"
              mv "${out}.sparse" "$out"
            fi
          }

          for part in system system_ext product; do
            raw="gapps_${part}_raw"
            fmt=$(cat "${part}_format.txt" 2>/dev/null || echo "erofs")
            uuid=$(cat "${part}_uuid.txt" 2>/dev/null || echo "")
            params_file="${part}_erofs_params.txt"
            orig_img="../gapps/extracted/${part}.img"

            if [ ! -d "$raw" ]; then
              echo "WARNING: $raw not found, skipping $part"
              continue
            fi

            echo "=== Building $part (format=$fmt, uuid=$uuid) ==="
            if [ "$fmt" = "ext4" ]; then
              build_ext4 "$raw" "${part}_new.img" "$uuid" "$orig_img"
            else
              build_erofs "$raw" "${part}_new.img" "$uuid" "$params_file"
            fi

            file "${part}_new.img"
            ls -lh "${part}_new.img"
          done

      - name: Create recovery flashable ZIP
        run: |
          set -e
          cd work
          mkdir -p zip/META-INF/com/google/android

          cp system_new.img zip/system.img
          cp system_ext_new.img zip/system_ext.img
          cp product_new.img zip/product.img

          cat > zip/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD=$2
          ZIPFILE=$3

          ui_print() {
            echo "ui_print $1" >&$OUTFD
            echo "ui_print" >&$OUTFD
          }

          set_progress() {
            echo "set_progress $1" >&$OUTFD
          }

          mount_partitions() {
            mount /system 2>/dev/null || true
            mount /system_ext 2>/dev/null || true
            mount /product 2>/dev/null || true
            mount /vendor 2>/dev/null || true
          }

          flash_image() {
            local img="$1"
            local part="$2"
            if [ ! -f "$img" ]; then
              ui_print "WARNING: $img not found, skipping $part"
              return
            fi
            ui_print "Flashing $part from $img"
            dd if="$img" of="/dev/block/by-name/$part" bs=1M 2>/dev/null || \
              dd if="$img" of="/dev/block/bootdevice/by-name/$part" bs=1M 2>/dev/null || \
              ui_print "ERROR: failed to flash $part"
          }

          ui_print "=== Convert GApps to Vanilla ==="
          ui_print "Flashing system, system_ext, product"

          set_progress 0.1
          flash_image "system.img" "system"
          set_progress 0.4
          flash_image "system_ext.img" "system_ext"
          set_progress 0.7
          flash_image "product.img" "product"
          set_progress 1.0

          ui_print "=== Done ==="
          ui_print "Reboot to system"
          EOF
          chmod +x zip/META-INF/com/google/android/update-binary

          cat > zip/META-INF/com/google/android/updater-script <<'EOF'
          package_extract_file("system.img", "/tmp/system.img");
          package_extract_file("system_ext.img", "/tmp/system_ext.img");
          package_extract_file("product.img", "/tmp/product.img");
          run_program("/sbin/sh", "/tmp/update-binary", "3", "1", "/tmp/updater-script");
          EOF

          cd zip
          zip -r -9 ../convert-to-vanilla.zip . -x "*.git*"
          cd ..
          ls -lh convert-to-vanilla.zip

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event.inputs.release_tag }}" = "auto" ]; then
            TAG="vanilla-$(date +%Y%m%d-%H%M)"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Vanilla ${{ steps.release_tag.outputs.tag }}"
          body: |
            Automated GApps to Vanilla conversion

            GApps source: ${{ github.event.inputs.gapps_url }}
            Vanilla source: ${{ github.event.inputs.vanilla_url }}

            Artifacts:
            - system_new.img
            - system_ext_new.img
            - product_new.img
            - convert-to-vanilla.zip (recovery flashable)

            Filesystem parameters and UUIDs preserved from original images.
            SELinux contexts preserved.
          files: |
            work/system_new.img
            work/system_ext_new.img
            work/product_new.img
            work/convert-to-vanilla.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-images
          path: |
            work/system_new.img
            work/system_ext_new.img
            work/product_new.img
            work/convert-to-vanilla.zip
            work/*_format.txt
            work/*_uuid.txt
            work/*_erofs_params.txt
          retention-days: 7
